name: Node CI

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Setup Node.js version
      uses: actions/setup-node@v6
      with:
        node-version: 24

    - name: Enable yarn
      run: corepack enable

    - name: Install dependencies
      run: yarn install --frozen-lockfile

    - name: Run lint
      run: yarn lint

    - name: Run build
      run: yarn build
