name: Release

on:
  workflow_dispatch:
    inputs:
      VERSION_BUMP:
        description: 'The version bump'
        type: choice
        options:
        - major
        - minor
        - patch
        default: minor
        required: true

jobs:
  release:
    runs-on: ubuntu-latest
    concurrency:
      group: release
      cancel-in-progress: false
    environment: release
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        persist-credentials: false

    - name: Setup Node.js version
      uses: actions/setup-node@v6
      with:
        node-version: 24

    - name: Enable yarn
      run: corepack enable

    - name: Install dependencies
      run: yarn install --frozen-lockfile

    - name: Run build
      run: yarn build

    - name: Configure git
      run: |
        git config user.name "Uphold"
        git config user.email "bot@uphold.com"
        git config --global url.https://${{ secrets.RELEASE_GITHUB_TOKEN }}@github.com/.insteadOf https://github.com/

    - name: Generate release
      env:
        GITHUB_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN }}
        NPM_TOKEN: ${{ secrets.RELEASE_NPM_TOKEN }}
      run: |
        echo "//registry.npmjs.org/:_authToken=\${NPM_TOKEN}" > .npmrc
        npm run release -- --increment "${{ github.event.inputs.VERSION_BUMP }}" -V
